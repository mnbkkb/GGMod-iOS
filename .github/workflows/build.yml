name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          echo "Installing Theos..."
          export THEOS=/tmp/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          brew install ldid
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build
        run: |
          export THEOS=/tmp/theos
          make
          echo "Build done!"
          ls -la

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GGMod-IPA
          path: |
            .theos/obj/
            *.ipa
