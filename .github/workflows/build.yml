name: Build GGMod IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=/tmp/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          brew install ldid
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build
        run: |
          export THEOS=/tmp/theos
          make package

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GGMod-IPA
          path: packages/*.deb
