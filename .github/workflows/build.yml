name: Build Test IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          echo "=== 开始安装Theos ==="
          export THEOS=/tmp/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          brew install ldid
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "=== Theos安装完成 ==="

      - name: Build
        run: |
          echo "=== 开始编译 ==="
          export THEOS=/tmp/theos
          make
          echo "=== 编译完成 ==="
          ls -la .theos/obj/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Test-App
          path: .theos/obj/*
